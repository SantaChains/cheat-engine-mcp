# Static type checking standard for the MCP server (run from MCP_Server/):
#   python -m mypy mcp_cheatengine.py
# The transport layer is fully annotated; ignores are limited to deliberate
# dynamism (SDK monkey-patches, the 1.x/2.x shim) and untyped third parties.
[mypy]
python_version = 3.10
ignore_missing_imports = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_return_any = False
